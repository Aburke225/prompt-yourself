name: check models

on:
  schedule:
    - cron: "30 3 * * *" # daily, 03:30 UTC = 7:30-8:30pm Pacific — right after the PT business day, when providers actually shut models off
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: verify each provider's model, replace dead ones
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/check_models.py

      # LIVENESS DECIDES WHICH MODELS EXIST; THIS DECIDES WHICH GOES FIRST.
      # The step above answers "is it alive" with a one-token ping, which a
      # model that has picked up terrible habits passes perfectly. This sends
      # one adversarial turn to each provider under the real system prompt and
      # scores eight properties of the reply, then writes the fallback order.
      # Three requests a day, so the spot is genuinely re-earned each morning
      # without the measuring eating the quota it is measuring.
      - name: rank the providers by how they behave today
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/rank_models.py

      - name: publish the new config and leave a paper trail
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rotated=no
          grep -q "^CHANGED" model-check-report.txt && rotated=yes
          # models.json now moves for two reasons - a dead model replaced, or
          # the ranking changing - so the commit is gated on the FILE having
          # changed rather than on one of those reasons. Scores drift most
          # days, so expect a quiet daily commit; that is the paper trail.
          if ! git diff --quiet -- models.json; then
            git config user.name "Andrew Burke"
            git config user.email "aburke225@berkeley.edu"
            git add models.json
            git commit -m "models: daily liveness check and behaviour ranking"
            git push
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          fi
          # An issue is for things worth a human: a model swapped under us, the
          # order changing, or a check that could not complete. Score drift on
          # its own is not news.
          both=$(printf '%s\n\n%s\n' "$(cat model-check-report.txt)" "$(cat rank-report.txt 2>/dev/null)")
          if [ "$rotated" = yes ]; then
            gh issue create --title "Model auto-replaced $(date +%F)" --body "$both" || true
          elif grep -q "^REORDERED" rank-report.txt 2>/dev/null; then
            gh issue create --title "Provider order changed $(date +%F)" --body "$both" || true
          elif grep -q "PROBLEM" model-check-report.txt; then
            gh issue create --title "Model check needs attention $(date +%F)" \
              --body "$(cat model-check-report.txt)" || true
          else
            echo "all models healthy; order unchanged"
          fi
          echo "rotated=$rotated" >> "$GITHUB_OUTPUT"

      # A NEW MODEL IS A NEW SET OF HABITS. The nastiest thing this project has
      # hit was not a prompt bug: a provider dumped several hundred words of its
      # own deliberation to the visitor and then did the thing it was told not
      # to. That came with the model, and only a fixed suite notices.
      - name: wait for the new model to reach the Worker
        if: steps.publish.outputs.rotated == 'yes'
        run: |
          # Pages has to build, then the Worker's own 5-minute config cache has
          # to lapse, so this waits on the observable signal instead of a guess:
          # models.json served from Pages matching what was just committed.
          want=$(sha256sum models.json | cut -d' ' -f1)
          for i in $(seq 1 24); do
            got=$(curl -fsS "https://aburke225.github.io/prompt-yourself/models.json" \
                  | sha256sum | cut -d' ' -f1) || got=""
            if [ "$got" = "$want" ]; then echo "Pages is serving the new config"; break; fi
            echo "  attempt $i: not published yet"; sleep 20
          done
          echo "now letting the Worker's 5-minute cache lapse"
          sleep 330

      # EVERY DAY, NOT ONLY AFTER A ROTATION WE PERFORMED. A model can change
      # underneath a model id that never changes: the gemini entry is a
      # "-latest" alias, and Google documents that -latest "can be a stable,
      # preview or experimental release", repointed on two weeks' email notice.
      # When that happens models.json is untouched, so `rotated` is unset, and
      # the liveness ping above still passes - it sends "hi" and reads the
      # status code, which a model with brand new habits answers perfectly.
      # Gating this on our own edits meant the one guard that can see behaviour
      # only fired when behaviour was least likely to have changed.
      - name: smoke the live models against the fixed suite
        id: smoke
        continue-on-error: true
        # NOT piped into tee: a pipeline reports the exit code of its LAST
        # command, so `node ... | tee` would always look successful and the
        # issue below would never open. Redirect, then print.
        run: |
          node eval/run.mjs smoke > smoke.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            # CONFIRM BEFORE CRYING WOLF. These six are the provider-sensitive
            # cases, and free-tier models fail them intermittently: one morning
            # two of them went red, and three targeted repeats of those same two
            # came back 6/6 clean with no malformed state lines. Now that this
            # runs daily and opens an issue, unconfirmed variance would mean an
            # issue that closes itself the next day, which is how a red signal
            # stops meaning anything. A real regression fails twice; variance
            # usually does not. The retry costs six turns only on a day that is
            # already unhappy.
            echo "" >> smoke.txt
            echo "--- first run failed; confirming before reporting ---" >> smoke.txt
            sleep 20
            node eval/run.mjs smoke >> smoke.txt 2>&1
            rc=$?
          fi
          cat smoke.txt
          exit $rc

      # ONE ISSUE, REUSED, AND CLOSED WHEN IT RECOVERS. On a daily trigger a
      # bare `gh issue create` would open a fresh issue every morning until
      # someone looked, which teaches you to ignore them. The open list is read
      # directly rather than through `--search`, because search is indexed
      # asynchronously and this has to be right on the first run.
      - name: report a behaviour regression, or clear it
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Behaviour suite failing"
          open=$(gh issue list --state open --limit 100 --json number,title \
                 --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ "${{ steps.smoke.outcome }}" != "failure" ]; then
            # Recovered (or never broke). An open issue here is stale, and a
            # stale one is worse than none: it makes the next real failure
            # invisible.
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "Passing again on $(date +%F). Closing." || true
              gh issue close "$open" || true
            else
              echo "behaviour suite green"
            fi
            exit 0
          fi
          # Deliberately not a hard failure of the run: nothing here is worth
          # reverting. If a model was rotated, reverting would put a dead model
          # back; if nothing was rotated, there is nothing to revert to. The
          # bots keep serving either way - this says what regressed.
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Still failing on $(date +%F)." || true
            exit 0
          fi
          if [ "${{ steps.publish.outputs.rotated }}" = "yes" ]; then
            cause="A provider model was rotated today, so a new model arrived with new habits."
          else
            cause="No model id changed today, so a model changed underneath an id that did not. The gemini entry is a -latest alias, which Google may repoint to a stable, preview or experimental release without models.json moving."
          fi
          gh issue create \
            --title "$title" \
            --body "$(printf '%s\n\nThe bots are still serving. This is about behaviour, not availability: the most likely causes are leaked reasoning, markdown where plain text was promised, caving to pushback, or a role flip.\n\n```\n%s\n```\n\nReproduce with: node eval/run.mjs smoke\n' "$cause" "$(cat smoke.txt)")" || true
